[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyscout"
version = "0.1.0"
description = "Onboard aerial object detection and RTSP streaming"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "onnxruntime>=1.16,<2", "opencv-python-headless>=4.8,<5"]

[project.scripts]
skyscout = "skyscout.app:main"

[tool.setuptools.packages.find]
where = ["src"]

